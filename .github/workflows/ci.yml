name: CI

# Runs the offline test suite (no API key, no data, no trained model needed) and a bug-only lint
# on every push and pull request. Golden review tests use the fixtures in tests/golden/.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff
      - name: Lint (bugs only; see [tool.ruff.lint] in pyproject.toml)
        run: ruff check --output-format=github .
      - name: Tests
        run: pytest -q
