name: CI

# Runs the offline test suite (no API key, no data, no trained model needed) and a bug-only lint
# on pull requests, and on pushes to main (to confirm the merged result). Branch pushes without a
# PR don't run it, so a PR branch isn't tested twice. Golden review tests use tests/golden/.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:     # "Run workflow" button in the Actions tab, for a manual run

# A newer push to the same PR cancels the run that's still going for the old commit.
# Runs on main are never cancelled, so every merged commit gets a full result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff
      - name: Lint (bugs only; see [tool.ruff.lint] in pyproject.toml)
        run: ruff check --output-format=github .
      - name: Tests
        run: pytest -q
